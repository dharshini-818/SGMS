server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: sgms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    properties:
      hibernate:
        format_sql: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/sgmsdb;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  grading:
    max-internal: 50.0
    max-external: 50.0
    pass-marks: 40.0
  institution:
    name: ${APP_INSTITUTION_NAME:Apex Institute of Science & Technology}
    address: ${APP_INSTITUTION_ADDRESS:Academic Square, Knowledge City}

management:
  endpoints:
    web:
      exposure:
        include: health,info
